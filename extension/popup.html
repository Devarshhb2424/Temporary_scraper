<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #0f172a;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }
        .title {
            font-weight: 700;
            font-size: 15px;
            color: #059669;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ecfdf5;
            color: #047857;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
        }
        .desc {
            font-size: 12px;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 14px;
        }
        .action-link {
            display: block;
            text-align: center;
            background: #059669;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 9px;
            border-radius: 8px;
            transition: background 0.15s;
        }
        .action-link:hover {
            background: #047857;
        }
    </style>
</head>
<body>
    <div class="header">
        <span style="font-size: 22px;">🏕️</span>
        <div>
            <div class="title">Campsite Finder</div>
            <div style="font-size: 11px; color: #64748b;">Auto-Cart Assistant</div>
        </div>
    </div>
    <div class="status-badge">
        <span class="status-dot"></span>
        <span>Active & Ready</span>
    </div>
    <div class="desc">
        When you click <b>"1-Click Book / Lock"</b> in your Campsite Finder web app, this assistant automatically selects your dates and locks the site into your Recreation.gov cart in 1 second!
    </div>
    <a href="https://www.recreation.gov/cart" target="_blank" class="action-link">
        🛒 Open Recreation.gov Cart ↗
    </a>
</body>
</html>
