<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recreation.gov Campsite Finder & Auto-Hold</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 15px;
            color: #0f172a;
        }

        .container {
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            width: 520px;
            max-width: 100%;
        }

        h1 {
            text-align: center;
            margin: 0 0 4px 0;
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 18px;
        }

        /* Session Status Box */
        .session-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 20px;
            font-size: 12.5px;
        }

        .session-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-green { background: #10b981; box-shadow: 0 0 0 2px #dcfce7; }
        .dot-red { background: #ef4444; box-shadow: 0 0 0 2px #fee2e2; }

        .btn-login-session {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-login-session:hover {
            background: #1d4ed8;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }

        select, input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background: #f8fafc;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="date"]:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .date-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 13px;
            color: #475569;
            cursor: pointer;
        }

        .checkbox-row input {
            cursor: pointer;
            accent-color: #059669;
        }

        #api-response {
            margin-top: 24px;
            font-size: 14px;
            line-height: 1.5;
        }

        .facilities-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 6px;
            display: block;
            color: #0f172a;
        }

        .results-summary {
            font-size: 12px;
            color: #64748b;
            margin: 4px 0 14px;
            display: block;
        }

        .facility-grid {
            display: grid;
            gap: 12px;
        }

        .facility-card {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .facility-card:hover {
            transform: translateY(-2px);
            border-color: #94a3b8;
            box-shadow: 0 8px 16px -4px rgba(15, 23, 42, 0.08);
        }

        .facility-image {
            width: 58px;
            height: 58px;
            border-radius: 8px;
            background: linear-gradient(135deg, #dcfce7, #bbf7d0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .facility-image-photo {
            width: 58px;
            height: 58px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            background: #e2e8f0;
            flex-shrink: 0;
        }

        .facility-content {
            flex: 1;
            min-width: 0;
        }

        .facility-name {
            font-weight: 700;
            font-size: 14px;
            line-height: 1.3;
            color: #0f172a;
        }

        .facility-meta {
            color: #64748b;
            font-size: 12px;
            margin-top: 3px;
        }

        .badge-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-success { background: #dcfce7; color: #166534; }
        .badge-partial { background: #e0f2fe; color: #0369a1; }
        .badge-gray { background: #f1f5f9; color: #475569; }

        .dates-preview {
            font-size: 11px;
            color: #059669;
            margin-top: 4px;
            line-height: 1.3;
            word-break: break-word;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .book-link {
            font-size: 12px;
            font-weight: 600;
            color: #2563eb;
            text-decoration: none;
        }

        .book-link:hover {
            text-decoration: underline;
        }

        /* Auto-Hold Action Button */
        .btn-hold {
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }

        .btn-hold:hover:not(:disabled) {
            background: #059669;
            transform: scale(1.02);
        }

        .btn-hold:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        /* Hold Success Banner */
        .hold-success-banner {
            background: #ecfdf5;
            border: 2px solid #10b981;
            color: #065f46;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .timer-display {
            font-size: 26px;
            font-weight: 800;
            color: #059669;
            margin: 8px 0;
            letter-spacing: 1px;
        }

        .btn-open-cart {
            display: inline-block;
            background: #059669;
            color: white;
            text-decoration: none;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 8px;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.2);
        }

        .btn-open-cart:hover {
            background: #047857;
        }

        .pager {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
        }

        .pager button {
            border: 1px solid #cbd5e1;
            background: white;
            color: #0f172a;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .pager button:hover:not(:disabled) { background: #f8fafc; }
        .pager button:disabled { opacity: 0.4; cursor: not-allowed; }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            border: 1px solid #cbd5e1;
            background: white;
            color: #0f172a;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.15s;
        }

        .back-button:hover { background: #f8fafc; }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 10px;
            text-align: center;
            color: #475569;
            gap: 10px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-alert {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏕️ Campsite Finder</h1>
    <div class="subtitle">Search Campgrounds, Live Dates & 15-Min Auto-Hold</div>

    <!-- Recreation.gov Session Bar -->
    <div class="session-bar">
        <div class="session-status" id="session-status-text">
            <span class="status-dot dot-red" id="session-dot"></span>
            <span id="session-label">Checking Recreation.gov Session...</span>
        </div>
        <button type="button" class="btn-login-session" id="btn-login-session" onclick="triggerLoginSession()">
            🔑 Log In to Rec.gov
        </button>
    </div>

    <!-- Active Cart Reservation Banner -->
    <div id="cart-hold-banner" style="display: none;" class="hold-success-banner">
        <div style="font-weight: 800; font-size: 15px;">🎉 Campsite Locked in Your Cart!</div>
        <div style="font-size: 12px; color: #065f46; margin-top: 2px;">
            Recreation.gov is holding this site for you:
        </div>
        <div class="timer-display" id="hold-countdown">15:00</div>
        <a href="https://www.recreation.gov/cart" target="_blank" rel="noopener noreferrer" class="btn-open-cart">
            🛒 Open Cart & Complete Checkout ↗
        </a>
    </div>

    <form id="state-form" onsubmit="return false;">
        <label for="state">Select State</label>
        <select name="state" id="state" required>
            <option value="" disabled selected>-- Select a State --</option>
            {% for state in states %}
                <option value="{{ state.abbreviation }}">
                    {{ state.name }} ({{ state.abbreviation }})
                </option>
            {% endfor %}
        </select>

        <div class="date-grid">
            <div>
                <label for="start-date">Check-in Date</label>
                <input type="date" id="start-date" required placeholder="Select check-in date">
            </div>

            <div>
                <label for="end-date">Check-out Date</label>
                <input type="date" id="end-date" required placeholder="Select check-out date">
            </div>
        </div>

        <label class="checkbox-row">
            <input type="checkbox" id="continuous-only">
            <span>Show only sites available for entire continuous stay</span>
        </label>
    </form>

    <div id="api-response">
        Select a state to explore campgrounds.
    </div>

</div>

<script>
    const stateSelect = document.getElementById('state');
    const startDateInput = document.getElementById('start-date');
    const endDateInput = document.getElementById('end-date');
    const continuousOnlyCheck = document.getElementById('continuous-only');
    const responseBox = document.getElementById('api-response');
    const sessionDot = document.getElementById('session-dot');
    const sessionLabel = document.getElementById('session-label');
    const btnLoginSession = document.getElementById('btn-login-session');
    const cartHoldBanner = document.getElementById('cart-hold-banner');
    const holdCountdown = document.getElementById('hold-countdown');

    // Restrict dates to today or future
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    startDateInput.min = todayStr;
    endDateInput.min = todayStr;

    // Synchronize check-out date and automatically refresh active campground results
    function handleDateChange() {
        if (startDateInput.value) {
            // Check-out must be at least 1 day after check-in for overnight stay
            const startD = new Date(startDateInput.value);
            const nextD = new Date(startD);
            nextD.setDate(nextD.getDate() + 1);
            const nextDStr = nextD.toISOString().split('T')[0];

            endDateInput.min = nextDStr;

            // If check-out is missing or on/before check-in date, advance it
            if (!endDateInput.value || endDateInput.value <= startDateInput.value) {
                endDateInput.value = nextDStr;
            }
        }

        // Automatically re-fetch availability if user is actively viewing a campground's campsites
        if (currentFacilityId && currentFacilityName && startDateInput.value && endDateInput.value) {
            fetchCampsiteAvailability(currentFacilityId, currentFacilityName);
        }
    }

    startDateInput.addEventListener('change', handleDateChange);
    endDateInput.addEventListener('change', handleDateChange);

    let currentPage = 1;
    let currentStateCode = stateSelect.value || '';
    let totalPages = 1;
    let currentCampsites = [];
    let currentFacilityName = '';
    let currentFacilityId = '';
    let currentDateRange = null;
    let countdownInterval = null;
    let isCloudMode = false;

    function escapeHtml(value = '') {
        return String(value).replace(/[&<>"']/g, (char) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
    }

    // Check Session Status on load
    async function checkSessionStatus() {
        try {
            const resp = await fetch('/api/session/status');
            const data = await resp.json();
            if (data.is_cloud) {
                isCloudMode = true;
                sessionDot.className = 'status-dot dot-green';
                sessionLabel.innerHTML = 'Direct Booking Mode <span style="font-size: 11px; color: #059669; font-weight: normal;">(Cloud Active)</span>';
                if (btnLoginSession) {
                    btnLoginSession.innerHTML = 'Rec.gov Account ↗';
                    btnLoginSession.title = 'Open Recreation.gov in your browser';
                }
            } else if (data.logged_in) {
                isCloudMode = false;
                sessionDot.className = 'status-dot dot-green';
                sessionLabel.textContent = 'Session: Logged In ✓';
                if (btnLoginSession) {
                    btnLoginSession.innerHTML = 'Re-link Login';
                }
            } else {
                isCloudMode = false;
                sessionDot.className = 'status-dot dot-red';
                sessionLabel.textContent = 'Session: Not Logged In';
                if (btnLoginSession) {
                    btnLoginSession.innerHTML = '🔑 Log In to Rec.gov';
                }
            }
        } catch {
            sessionDot.className = 'status-dot dot-red';
            sessionLabel.textContent = 'Session: Offline';
        }
    }

    async function triggerLoginSession() {
        if (isCloudMode) {
            window.open('https://www.recreation.gov/', '_blank');
            return;
        }

        alert("Opening a browser window for Recreation.gov login. Please log in with your account so the Auto-Hold bot can access your session.");
        try {
            const resp = await fetch('/api/session/login', { method: 'POST' });
            const data = await resp.json();

            if (data.is_cloud) {
                window.open(data.account_url || 'https://www.recreation.gov/', '_blank');
                return;
            }

            // Poll for login status change locally
            let attempts = 0;
            const poller = setInterval(async () => {
                attempts++;
                const sresp = await fetch('/api/session/status');
                const sdata = await sresp.json();
                if (sdata.logged_in) {
                    sessionDot.className = 'status-dot dot-green';
                    sessionLabel.textContent = 'Session: Logged In ✓';
                    clearInterval(poller);
                }
                if (attempts > 30) clearInterval(poller);
            }, 5000);
        } catch (e) {
            alert("Error launching login window: " + e.message);
        }
    }

    function startCartCountdown(seconds = 900) {
        if (countdownInterval) clearInterval(countdownInterval);
        let remaining = seconds;
        cartHoldBanner.style.display = 'block';

        const updateTimer = () => {
            const m = Math.floor(remaining / 60).toString().padStart(2, '0');
            const s = (remaining % 60).toString().padStart(2, '0');
            holdCountdown.textContent = `${m}:${s}`;
            if (remaining <= 0) {
                clearInterval(countdownInterval);
                holdCountdown.textContent = "EXPIRED";
            }
            remaining--;
        };

        updateTimer();
        countdownInterval = setInterval(updateTimer, 1000);
    }

    async function handleAutoHold(facilityId, campsiteId, campsiteName) {
        const dateRange = getSelectedDateRange();
        if (!dateRange) {
            alert("Please select dates first.");
            return;
        }

        const btn = document.getElementById(`btn-hold-${campsiteId}`);
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '⏳ Processing...';
        }

        try {
            const resp = await fetch('/api/campsite/hold', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    facility_id: facilityId,
                    campsite_id: campsiteId,
                    start_date: dateRange.startDate,
                    end_date: dateRange.endDate
                })
            });

            const result = await resp.json();

            if (result.is_cloud_direct) {
                // Cloud deployment: 1-Click direct browser booking in user's logged-in browser
                startCartCountdown(result.timer_minutes * 60);
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '✓ Opening Booking...';
                    btn.style.background = '#059669';
                }
                window.open(result.booking_url, '_blank');
                return;
            }

            if (result.success) {
                startCartCountdown(result.timer_minutes * 60);
                if (btn) {
                    btn.innerHTML = '✓ Held in Cart!';
                    btn.style.background = '#059669';
                }
                alert(`🎉 SUCCESS: ${campsiteName} has been added to your Recreation.gov cart! You have 15 minutes to complete payment.`);
            } else {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '⚡ Auto-Hold (15m lock)';
                }
                alert(`Notice: ${result.message}\nOpening direct booking page instead.`);
                if (result.booking_url) {
                    window.open(result.booking_url, '_blank');
                }
            }
        } catch (err) {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '⚡ Auto-Hold (15m lock)';
            }
            alert("Booking error: " + err.message);
        }
    }

    function getSelectedDateRange() {
        const startDate = startDateInput.value;
        const endDate = endDateInput.value;

        if (!startDate || !endDate) return null;
        if (new Date(endDate) < new Date(startDate)) {
            throw new Error('End date must be on or after start date.');
        }

        return { startDate, endDate };
    }

    function showCampgroundMenu() {
        if (!currentStateCode) {
            responseBox.innerHTML = 'Select a state to explore campgrounds.';
            return;
        }
        loadFacilitiesPage(currentPage);
    }

    function renderBackToCampgroundButton() {
        return `
            <button type="button" class="back-button" data-action="back-to-campground">
                ← Back to Campgrounds
            </button>
        `;
    }

    function renderCampsiteList(facilityName, campsites) {
        currentFacilityName = facilityName;
        currentCampsites = campsites;
        const dateSummary = currentDateRange
            ? ` for ${currentDateRange.startDate} to ${currentDateRange.endDate}`
            : '';

        if (!campsites || !campsites.length) {
            responseBox.innerHTML = `
                <span class="facilities-title">Available Campsites</span>
                <div class="empty-alert">
                    No available campsites found${dateSummary} for <strong>${escapeHtml(facilityName)}</strong>.
                    <br><small>Try selecting different dates or unchecking continuous stay.</small>
                </div>
                ${renderBackToCampgroundButton()}
            `;
            responseBox.querySelector('[data-action="back-to-campground"]').addEventListener('click', showCampgroundMenu);
            return;
        }

        const itemsHtml = campsites.map((campsite) => {
            const name = campsite?.CampsiteName || `Site ${campsite?.site_number || 'N/A'}`;
            const type = campsite?.CampsiteType || campsite?.campsite_type || 'Camp/RV';
            const loop = campsite?.Loop || campsite?.loop || 'General Loop';
            const availCount = campsite?.available_days_count ?? 0;
            const totalDays = campsite?.total_requested_days ?? 0;
            const isContinuous = campsite?.is_continuous_stay ?? false;
            const availDates = campsite?.available_dates || '';
            const bookingUrl = campsite?.booking_url || `https://www.recreation.gov/camping/campsites/${campsite?.CampsiteID || ''}`;
            const imageUrl = campsite?.image_url || '';
            const siteId = campsite?.CampsiteID;

            const badgeMarkup = isContinuous
                ? `<span class="badge badge-success">✓ Entire Stay (${availCount}/${totalDays} days)</span>`
                : `<span class="badge badge-partial">${availCount}/${totalDays} Days Available</span>`;

            const imageMarkup = imageUrl
                ? `<img class="facility-image-photo" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.outerHTML='<div class=\\'facility-image\\'>🏕️</div>'">`
                : `<div class="facility-image">🏕️</div>`;

            return `
                <div class="facility-card" data-campsite-id="${escapeHtml(String(siteId))}">
                    ${imageMarkup}
                    <div class="facility-content">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
                            <div class="facility-name">${escapeHtml(name)}</div>
                            ${badgeMarkup}
                        </div>
                        <div class="facility-meta">${escapeHtml(type)} • ${escapeHtml(loop)}</div>
                        <div class="dates-preview">📅 Available: ${escapeHtml(availDates)}</div>
                        
                        <div class="card-actions">
                            <button type="button" class="btn-hold" id="btn-hold-${escapeHtml(String(siteId))}" onclick="event.stopPropagation(); handleAutoHold('${escapeHtml(String(currentFacilityId))}', '${escapeHtml(String(siteId))}', '${escapeHtml(name)}')">
                                ⚡ Auto-Hold (15m lock)
                            </button>
                            <a class="book-link" href="${escapeHtml(bookingUrl)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">
                                Book on Rec.gov ↗
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        responseBox.innerHTML = `
            <span class="facilities-title">${escapeHtml(facilityName)}</span>
            <span class="results-summary">Found ${campsites.length} available campsites${dateSummary}</span>
            <div class="facility-grid">
                ${itemsHtml}
            </div>
            ${renderBackToCampgroundButton()}
        `;

        responseBox.querySelector('[data-action="back-to-campground"]').addEventListener('click', showCampgroundMenu);
    }

    async function fetchCampsiteAvailability(facilityId, facilityName) {
        currentFacilityId = facilityId;
        currentFacilityName = facilityName;

        try {
            currentDateRange = getSelectedDateRange();
            if (!currentDateRange) {
                alert("Please select both Start and End dates.");
                return;
            }

            const isContinuous = continuousOnlyCheck.checked ? '&only_continuous=true' : '';
            const queryUrl = `/location/facilities/${encodeURIComponent(facilityId)}/campsites/?start_date=${encodeURIComponent(currentDateRange.startDate)}&end_date=${encodeURIComponent(currentDateRange.endDate)}${isContinuous}`;

            responseBox.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <div>Scanning availability for <strong>${escapeHtml(facilityName)}</strong>...</div>
                    <div style="font-size: 12px; color: #64748b;">Checking dates: ${currentDateRange.startDate} to ${currentDateRange.endDate}</div>
                </div>
            `;

            const response = await fetch(queryUrl);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || data.error || `HTTP ${response.status}`);
            }

            const campsites = Array.isArray(data.campsites) ? data.campsites : [];
            renderCampsiteList(facilityName, campsites);

        } catch (error) {
            responseBox.innerHTML = `
                <span class="facilities-title">Unable to check availability</span>
                <div class="empty-alert">${escapeHtml(error.message)}</div>
                ${renderBackToCampgroundButton()}
            `;
            responseBox.querySelector('[data-action="back-to-campground"]').addEventListener('click', showCampgroundMenu);
        }
    }

    async function loadFacilitiesPage(pageNumber) {
        const stateCode = currentStateCode;
        if (!stateCode) return;

        const offset = (pageNumber - 1) * 20;
        const url = `/location/facilities/?state=${encodeURIComponent(stateCode)}&offset=${offset}&limit=20`;

        responseBox.innerHTML = `
            <div class="loading-state">
                <div class="spinner"></div>
                <div>Fetching campgrounds for ${escapeHtml(stateCode)}...</div>
            </div>
        `;

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || data.error || `HTTP ${response.status}`);
            }

            const facilities = Array.isArray(data.facilities) ? data.facilities : [];
            if (!facilities.length) {
                responseBox.innerHTML = `
                    <div class="empty-alert">No campgrounds found for ${escapeHtml(stateCode)}.</div>
                `;
                return;
            }

            totalPages = Math.max(1, Math.ceil(Number(data.total_count || facilities.length) / 20));

            const items = facilities.map((facility) => {
                const name = facility?.FacilityName || 'Campground';
                const city = facility?.City || '';
                const state = facility?.State || stateCode;
                const price = facility?.Price ? ` • ${facility.Price}` : '';
                const rating = facility?.Rating ? ` • ⭐ ${facility.Rating}` : '';
                const imageUrl = facility?.FacilityImage;

                const imageMarkup = imageUrl
                    ? `<img class="facility-image-photo" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(name)}" onerror="this.outerHTML='<div class=\\'facility-image\\'>🏕️</div>'">`
                    : `<div class="facility-image">🏕️</div>`;

                const facilityId = facility?.FacilityID || '';
                return `
                    <div class="facility-card" data-facility-id="${escapeHtml(String(facilityId))}" data-facility-name="${escapeHtml(name)}">
                        ${imageMarkup}
                        <div class="facility-content">
                            <div class="facility-name">${escapeHtml(name)}</div>
                            <div class="facility-meta">${escapeHtml(city ? city + ', ' + state : state)}${escapeHtml(price)}${escapeHtml(rating)}</div>
                            <div style="font-size: 11px; color: #2563eb; margin-top: 4px; font-weight: 500;">
                                Click to check date availability →
                            </div>
                        </div>
                    </div>
                `;
            });

            const stateName = stateSelect.options[stateSelect.selectedIndex]?.text || stateCode;

            responseBox.innerHTML = `
                <span class="facilities-title">${escapeHtml(stateName)} Campgrounds</span>
                <span class="results-summary">Showing ${facilities.length} campgrounds. Click a campground to check availability.</span>
                <div class="facility-grid">
                    ${items.join('')}
                </div>
                <div class="pager">
                    <button type="button" ${pageNumber <= 1 ? 'disabled' : ''} data-page="${pageNumber - 1}">Prev</button>
                    <span class="page-label">Page ${pageNumber} of ${totalPages}</span>
                    <button type="button" ${pageNumber >= totalPages ? 'disabled' : ''} data-page="${pageNumber + 1}">Next</button>
                </div>
            `;

            responseBox.querySelectorAll('.facility-card').forEach((card) => {
                card.addEventListener('click', () => {
                    const facilityId = card.dataset.facilityId;
                    const facilityName = card.dataset.facilityName || 'Campground';
                    if (facilityId) {
                        fetchCampsiteAvailability(facilityId, facilityName);
                    }
                });
            });

            responseBox.querySelectorAll('button[data-page]').forEach((button) => {
                button.addEventListener('click', () => {
                    const nextPage = Number(button.dataset.page);
                    if (nextPage >= 1 && nextPage <= totalPages) {
                        currentPage = nextPage;
                        loadFacilitiesPage(nextPage);
                    }
                });
            });

        } catch (error) {
            responseBox.innerHTML = `
                <div class="empty-alert">Unable to load campgrounds: ${escapeHtml(error.message)}</div>
            `;
        }
    }

    stateSelect.addEventListener('change', async function () {
        currentStateCode = this.value;
        if (!currentStateCode) {
            responseBox.innerHTML = 'Select a state to explore campgrounds.';
            return;
        }

        currentPage = 1;
        totalPages = 1;
        await loadFacilitiesPage(1);
    });

    continuousOnlyCheck.addEventListener('change', () => {
        if (currentFacilityId && currentFacilityName) {
            fetchCampsiteAvailability(currentFacilityId, currentFacilityName);
        }
    });

    // Initial session check
    checkSessionStatus();

    // Auto-load campgrounds for default selected state
    if (stateSelect.value) {
        currentStateCode = stateSelect.value;
        loadFacilitiesPage(1);
    }
</script>

</body>
</html>
